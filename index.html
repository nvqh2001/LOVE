```html
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Một điều muốn nói ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 500px;
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            padding: 35px 25px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            z-index: 10;
        }

        .heart {
            font-size: 80px;
            animation: heartbeat 1.2s infinite;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }

        h1 {
            font-size: 30px;
            margin: 15px 0;
        }

        #message {
            min-height: 120px;
            font-size: 18px;
            line-height: 1.7;
            margin: 20px 0;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            border: none;
            padding: 13px 25px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        #yes {
            background: white;
            color: #ff4f81;
            font-weight: bold;
        }

        #yes:hover {
            transform: scale(1.1);
        }

        #no {
            background: rgba(0,0,0,0.25);
            color: white;
        }

        .hidden {
            display: none;
        }

        #success {
            animation: zoomIn 0.8s ease;
        }

        @keyframes zoomIn {
            from {
                transform: scale(0);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .floating-heart {
            position: fixed;
            bottom: -30px;
            font-size: 25px;
            animation: fly 5s linear forwards;
            pointer-events: none;
        }

        @keyframes fly {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        .small {
            margin-top: 20px;
            font-size: 13px;
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div class="container">

        <div id="main">

            <div class="heart">❤️</div>

            <h1>Gửi em, người đặc biệt...</h1>

            <div id="message"></div>

            <div class="buttons">
                <button id="yes" onclick="sayYes()">
                    ❤️ Em đồng ý
                </button>

                <button id="no" onclick="runAway()">
                    Không 😢
                </button>
            </div>

            <div class="small">
                Hãy suy nghĩ thật kỹ trước khi trả lời nhé...
            </div>

        </div>


        <div id="success" class="hidden">

            <div class="heart">💖</div>

            <h1>Yeeee! ❤️</h1>

            <p style="font-size:20px; line-height:1.7; margin-top:20px;">
                Cảm ơn em vì đã cho anh một cơ hội.
                <br><br>
                Từ hôm nay, anh sẽ cố gắng
                trở thành người khiến em luôn mỉm cười.
                <br><br>
                ❤️ Anh thích em rất nhiều ❤️
            </p>

        </div>

    </div>


    <script>

        // ==========================
        // LỜI TỎ TÌNH
        // ==========================

        const text =
        "Anh đã suy nghĩ rất lâu mới quyết định nói điều này... " +
        "Có lẽ em không biết, nhưng mỗi lần nói chuyện với em, " +
        "anh đều cảm thấy rất vui. " +
        "Anh không biết tương lai sẽ như thế nào, " +
        "nhưng anh biết rằng hiện tại anh thật sự thích em. " +
        "Vì vậy... anh muốn hỏi em một điều.";


        // ==========================
        // HIỆU ỨNG GÕ CHỮ
        // ==========================

        let i = 0;

        function typeWriter() {

            if (i < text.length) {

                document.getElementById("message").innerHTML += text.charAt(i);

                i++;

                setTimeout(typeWriter, 35);

            }

        }

        typeWriter();


        // ==========================
        // NÚT ĐỒNG Ý
        // ==========================

        function sayYes() {

            document.getElementById("main").classList.add("hidden");

            document.getElementById("success").classList.remove("hidden");

            createHearts();

        }


        // ==========================
        // NÚT KHÔNG CHẠY TRỐN
        // ==========================

        function runAway() {

            const button = document.getElementById("no");

            const maxX = window.innerWidth - button.offsetWidth - 20;
            const maxY = window.innerHeight - button.offsetHeight - 20;

            const x = Math.random() * maxX;
            const y = Math.random() * maxY;

            button.style.position = "fixed";
            button.style.left = x + "px";
            button.style.top = y + "px";

        }


        // ==========================
        // TIM BAY
        // ==========================

        function createHeart() {

            const heart = document.createElement("div");

            heart.className = "floating-heart";

            const hearts = ["❤️", "💖", "💕", "💗", "💓"];

            heart.innerHTML =
                hearts[Math.floor(Math.random() * hearts.length)];

            heart.style.left =
                Math.random() * 100 + "vw";

            heart.style.animationDuration =
                (3 + Math.random() * 3) + "s";

            document.body.appendChild(heart);

            setTimeout(() => {

                heart.remove();

            }, 6000);

        }


        function createHearts() {

            for (let i = 0; i < 50; i++) {

                setTimeout(() => {

                    createHeart();

                }, i * 100);

            }

        }

    </script>

</body>
</html>
```
